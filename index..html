<html lang="th"><head><meta charset="utf-8">

<style>

#toast.on{opacity:1;transform:translateX(-50%)}
#joy{display:none;position:fixed;left:calc(env(safe-area-inset-left,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.3);border:3px solid rgba(255,255,255,.7);touch-action:none}

#jb{display:none;position:fixed;right:calc(env(safe-area-inset-right,0px) + 24px);bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:96px;height:96px;border-radius:50%;background:#e52521;color:#fff;font-weight:800;line-height:96px;text-align:center;border:4px solid #fff;touch-action:none}
@media (pointer:coarse){#joy,#jb{display:block}}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,60,120,.35);backdrop-filter:blur(3px)}
.ov[hidden]{display:none}
.card{background:#fff;color:#223;border-radius:22px;padding:22px 26px;width:min(92vw,420px);text-align:center;box-shadow:0 10px 0 #0003}

button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:10px 16px;background:#e8eaf0;color:#223;border-bottom:4px solid #c3c8d4;cursor:pointer}
button.on{background:#2f6fe0;color:#fff;border-color:#1c4aa8}
#go,#again{background:#ffb703;border-color:#c98700;font-size:20px;padding:12px 34px;margin-top:6px}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud"><div id="sc">🪙 0</div><div id="lv">❤️❤️❤️</div><div id="pg">❓ 0/8</div></div>
<div id="q"></div><div id="toast"></div>
<div id="joy"><div id="knob"></div></div><div id="jb">กระโดด</div>
<div class="ov" id="start"><div class="card">
<h1>🍄 ผจญภัยคำยืม 3D</h1>
<p>เดินเข้าใกล้กล่อง <b>?</b> เพื่อรับคำถาม แล้วเดินไปยืนบนแท่นคำตอบที่ถูกต้อง เก็บเหรียญระหว่างทางด้วย</p>
<p><small>เดิน: WASD / ลูกศร · กระโดด: Space · วิ่ง: Shift<br>มือถือ: จอยสติ๊กซ้าย + ปุ่มกระโดดขวา</small></p>
<div class="modes"><button data-m="mix" class="on">ผสม</button><button data-m="cn">คำยืมจีน</button><button data-m="en">คำยืมอังกฤษ</button></div>
<button id="go">▶ เล่น</button></div></div>
<div class="ov" id="end" hidden><div class="card"><h1 id="et"></h1><p id="ep"></p><button id="again">เล่นอีกครั้ง</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const R=THREE,$=id=>document.getElementById(id);

en:[["คอมพิวเตอร์","computer"],["ฟุตบอล","football"],["ไมโครโฟน","microphone"],["แท็กซี่","taxi"],["เมนู","menu"],["ช็อกโกแลต","chocolate"],["เซลฟี่","selfie"],["ออนไลน์","online"],["แฟชั่น","fashion"],["ก๊อปปี้","copy"],["ไอศกรีม","ice cream"],["โปรเจกต์","project"]]};
const TH=["ข้าว","น้ำ","แมว","ปลา","ดาว","ไฟ","ลม","เสือ"],NM={cn:"จีน",en:"อังกฤษ"};
const pick=a=>a[Math.random()*a.length|0];
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
let mode='mix';
function makeQ(){
 const L=pick(mode==='mix'?['cn','en']:[mode]),O=L==='cn'?'en':'cn',[w,n]=pick(D[L]),e=`${w} มาจากภาษา${NM[L]} (${n})`;
 if(Math.random()<.5){
  const o=shuf([["จีน",L==='cn'],["อังกฤษ",L==='en'],["ไทยแท้",false]]);
  return{t:`"${w}" เป็นคำยืมจากภาษาใด?`,o:o.map(x=>x[0]),a:o.findIndex(x=>x[1]),e};
 }
 const o=shuf([[w,true],[pick(D[O])[0],false],[pick(TH),false]]);
 return{t:`คำใดเป็นคำยืมจากภาษา${NM[L]}?`,o:o.map(x=>x[0]),a:o.findIndex(x=>x[1]),e};
}
// ---------- sound ----------
let AC;function beep(f,d=.12,type='square',v=.05){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
// ---------- scene ----------
const renderer=new R.WebGLRenderer({canvas:$('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new R.Scene(),cam=new R.PerspectiveCamera(55,1,.1,220);
function rs(){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
{const c=document.createElement('canvas');c.width=2;c.height=256;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,'#3a9bf0');g.addColorStop(.6,'#9fd8ff');g.addColorStop(1,'#e6f6ff');x.fillStyle=g;x.fillRect(0,0,2,256);scene.background=new R.CanvasTexture(c)}
scene.fog=new R.Fog(0xb5e2ff,45,120);
scene.add(new R.HemisphereLight(0xffffff,0x6aa84f,.9));
const sunL=new R.DirectionalLight(0xfff2cc,.7);sunL.position.set(20,40,15);scene.add(sunL);
const mc={},M=c=>mc[c]||(mc[c]=new R.MeshLambertMaterial({color:c}));
const mesh=(g,m,x=0,y=0,z=0)=>{const o=new R.Mesh(g,m);o.position.set(x,y,z);return o};
const bx=(w,h,d,c,x,y,z)=>mesh(new R.BoxGeometry(w,h,d),M(c),x,y,z);
const sph=(r,c,x,y,z,s=10)=>mesh(new R.SphereGeometry(r,s,s-2),M(c),x,y,z);
// sun
{const s=mesh(new R.SphereGeometry(7,16,12),new R.MeshBasicMaterial({color:0xfff176,fog:false}),60,50,-100);scene.add(s)}
// ground
{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');x.fillStyle='#5fcf4e';x.fillRect(0,0,64,64);x.fillStyle='#53c142';x.fillRect(0,0,32,32);x.fillRect(32,32,32,32);
const t=new R.CanvasTexture(c);t.wrapS=t.wrapT=R.RepeatWrapping;t.repeat.set(50,50);t.magFilter=R.NearestFilter;
const g=mesh(new R.PlaneGeometry(200,200),new R.MeshLambertMaterial({map:t}));g.rotation.x=-Math.PI/2;scene.add(g)}
const solids=[],sw=[],clouds=[],coins=[],BX=[],parts=[];
const free=(x,z,r)=>solids.every(s=>Math.hypot(x-s.x,z-s.z)>s.r+r);
function place(n,r,fn,min=9,max=44){for(let i=0,k=0;i<n&&k<500;k++){const a=Math.random()*6.283,d=min+Math.random()*(max-min),x=Math.cos(a)*d,z=Math.sin(a)*d;if(free(x,z,r)){fn(x,z);i++}}}
// hills
for(let i=0;i<7;i++){const a=i*.9+.3,r=16+Math.random()*10,h=mesh(new R.SphereGeometry(r,20,10,0,6.283,0,1.5708),M(i%2?0x4cb847:0x5fd055),Math.cos(a)*(72+Math.random()*10),-2,Math.sin(a)*(72+Math.random()*10));h.scale.y=.6;scene.add(h)}
// pipes
place(5,1.6,(x,z)=>{const g=new R.Group();g.add(mesh(new R.CylinderGeometry(.9,.9,2.2,20),M(0x2fb34a),0,1.1,0));g.add(mesh(new R.CylinderGeometry(1.1,1.1,.5,20),M(0x238f3a),0,2.2,0));g.position.set(x,0,z);scene.add(g);solids.push({x,z,r:1.1,h:2.45})},10);
// trees
place(24,1.6,(x,z)=>{const g=new R.Group(),s=.8+Math.random()*.7,f=Math.random()<.5?0x2e9e3e:0x3fb54a;g.add(mesh(new R.CylinderGeometry(.25,.35,1.8,8),M(0x8b5a2b),0,.9,0));[[0,2.6,0,1.2],[.6,2.2,.2,.8],[-.6,2.3,-.2,.9]].forEach(([a,b,c,r])=>g.add(sph(r,f,a,b,c,12)));g.position.set(x,0,z);g.scale.setScalar(s);scene.add(g);solids.push({x,z,r:.6*s,h:99});sw.push({o:g,p:Math.random()*6,a:.015})},10);
// bushes
place(20,1,(x,z)=>{const g=new R.Group();[[0,.45,0,.6],[.55,.35,.1,.45],[-.5,.35,-.1,.5]].forEach(([a,b,c,r])=>g.add(sph(r,0x2a8f3a,a,b,c)));g.position.set(x,0,z);g.rotation.y=Math.random()*6;scene.add(g)},5);
// flowers
place(70,.3,(x,z)=>{const g=new R.Group(),c=pick([0xff5a7a,0xffd23f,0xffffff,0xb06cff,0xff8a3d]);g.add(mesh(new R.CylinderGeometry(.04,.04,.7,5),M(0x2f8f3a),0,.35,0));for(let i=0;i<5;i++){const a=i*1.2566;g.add(sph(.14,c,Math.cos(a)*.17,.75,Math.sin(a)*.17,6))}g.add(sph(.12,0xffe14d,0,.78,0,6));g.position.set(x,0,z);scene.add(g);sw.push({o:g,p:Math.random()*6,a:.12})},2,46);
// grass tufts
place(100,.2,(x,z)=>{const g=new R.Group();for(let i=0;i<3;i++){const c=mesh(new R.ConeGeometry(.08,.6,4),M(0x2f9e3a),(i-1)*.1,.3,0);c.rotation.z=(i-1)*.3;g.add(c)}g.position.set(x,0,z);scene.add(g);sw.push({o:g,p:Math.random()*6,a:.15})},1.5,48);
// clouds
for(let i=0;i<10;i++){const g=new R.Group(),m=new R.MeshLambertMaterial({color:0xffffff,emissive:0x888888});[[0,0,0,3],[3,-.5,0,2.4],[-3,-.5,0,2.2],[1,1.2,0,2.2]].forEach(([a,b,c,r])=>g.add(mesh(new R.SphereGeometry(r,10,8),m,a,b,c)));g.position.set(Math.random()*180-90,26+Math.random()*10,-30-Math.random()*70);scene.add(g);clouds.push(g)}
// question boxes
function qtex(bg,ch){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,128,128);x.strokeStyle='#7a4a00';x.lineWidth=10;x.strokeRect(5,5,118,118);x.fillStyle='#fff';x.font='bold 84px Tahoma,sans-serif';x.textAlign='center';x.textBaseline='middle';x.shadowColor='#0007';x.shadowOffsetY=5;x.fillText(ch,64,70);return new R.MeshLambertMaterial({map:new R.CanvasTexture(c)})}
const matQ=qtex('#ffc21a','?'),matU=qtex('#9aa0a6','✓');
place(8,2,(x,z)=>{const m=mesh(new R.BoxGeometry(1.5,1.5,1.5),matQ,x,2.4,z);scene.add(m);BX.push({m,x,z,used:false})},11,34);
// coins
const coinGeo=new R.CylinderGeometry(.4,.4,.1,16),coinMat=new R.MeshLambertMaterial({color:0xffd23f,emissive:0x7a5a00});
const mkCoin=()=>{const g=new R.Group(),m=new R.Mesh(coinGeo,coinMat);m.rotation.x=Math.PI/2;g.add(m);return g};
place(36,.6,(x,z)=>{const g=mkCoin();g.position.set(x,1,z);scene.add(g);coins.push({g,on:true,x,z})},4,42);
// ---------- player ----------
const player=new R.Group(),model=new R.Group(),head=new R.Group();player.add(model);scene.add(player);
model.add(bx(.95,.85,.6,0x2b4fd8,0,1.1,0),bx(.95,.3,.62,0xe52521,0,1.6,0));
head.position.y=1.95;model.add(head);
head.add(sph(.45,0xffcc99,0,0,0,16));
head.add(mesh(new R.SphereGeometry(.48,16,8,0,6.283,0,1.5708),M(0xe52521),0,.05,0),bx(.6,.08,.4,0xe52521,0,.08,.4),sph(.12,0xff9a73,0,-.08,.45,8),bx(.4,.08,.1,0x4a2a10,0,-.2,.42));
[-.17,.17].forEach(x=>head.add(sph(.06,0x111111,x,-.02,.42,6)));
function limb(x,y,col,len,tip,ty,tipFn){const p=new R.Group();p.position.set(x,y,0);p.add(bx(.28,len,.28,col,0,-len/2,0));p.add(tipFn(ty));model.add(p);return p}
const hand=y=>sph(.17,0xffffff,0,y,0,8),shoe=y=>bx(.4,.2,.55,0x6b3b1a,0,y,.08);
const armL=limb(-.65,1.65,0xe52521,.7,0,-.8,hand),armR=limb(.65,1.65,0xe52521,.7,0,-.8,hand);
const legL=limb(-.22,.75,0x2b4fd8,.55,0,-.6,shoe),legR=limb(.22,.75,0x2b4fd8,.55,0,-.6,shoe);
const shadow=mesh(new R.CircleGeometry(.65,16),new R.MeshBasicMaterial({color:0,transparent:true,opacity:.3}),0,.03,0);shadow.rotation.x=-Math.PI/2;scene.add(shadow);
const P={x:0,z:0,y:0,vy:0,vx:0,vz:0,f:0};
cam.position.set(0,7.5,11);
// ---------- input ----------
const K={};addEventListener('keydown',e=>{K[e.code]=1;if(e.code==='Space')e.preventDefault()});addEventListener('keyup',e=>K[e.code]=0);
let jx=0,jz=0,jumpReq=false,jid=null;const joy=$('joy'),knob=$('knob');
function jm(e){const r=joy.getBoundingClientRect(),mx=r.width/2;let dx=e.clientX-r.left-mx,dy=e.clientY-r.top-mx;const m=Math.hypot(dx,dy);if(m>mx){dx*=mx/m;dy*=mx/m}knob.style.transform=`translate(${dx}px,${dy}px)`;jx=dx/mx;jz=dy/mx}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e)});
const jend=()=>{jid=null;jx=jz=0;knob.style.transform=''};joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
$('jb').addEventListener('pointerdown',e=>{e.preventDefault();jumpReq=true});
// ---------- game state ----------
let score=0,lives=3,done=0,playing=false,act=null,shake=0,tt;
const PC=[0xe5453b,0x2f6fe0,0x2fa84f],PS=['#e5453b','#2f6fe0','#2fa84f'];
function hud(){$('sc').textContent='🪙 '+score;$('lv').textContent='❤️'.repeat(Math.max(lives,0))||'💔';$('pg').textContent=`❓ ${done}/${BX.length}`}
function toast(t,ok){const el=$('toast');el.textContent=t;el.style.background=ok?'#2fa84f':'#e5453b';el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),3300)}
function label(txt,col){const c=document.createElement('canvas');c.width=320;c.height=128;const x=c.getContext('2d');x.fillStyle=col;x.beginPath();x.moveTo(34,6);x.arcTo(314,6,314,122,28);x.arcTo(314,122,6,122,28);x.arcTo(6,122,6,6,28);x.arcTo(6,6,314,6,28);x.fill();x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';let fs=56;x.font=`bold ${fs}px Tahoma,sans-serif`;while(x.measureText(txt).width>270&&fs>20){fs-=4;x.font=`bold ${fs}px Tahoma,sans-serif`}x.fillText(txt,160,68);const s=new R.Sprite(new R.SpriteMaterial({map:new R.CanvasTexture(c),transparent:true,depthTest:false}));s.scale.set(4.4,1.76,1);s.renderOrder=5;return s}
function startQ(b){const q=makeQ(),ang=Math.atan2(b.z-P.z,b.x-P.x);
 const pads=q.o.map((txt,i)=>{const a=ang+(i-1)*.8,x=clamp(b.x+Math.cos(a)*6,-40,40),z=clamp(b.z+Math.sin(a)*6,-40,40),g=new R.Group();g.add(mesh(new R.CylinderGeometry(1.3,1.3,.25,24),M(PC[i]),0,.12,0));const s=label(txt,PS[i]);s.position.y=2.5;g.add(s);g.position.set(x,0,z);scene.add(g);return{g,x,z}});
 act={b,q,pads};$('q').textContent=q.t+' — เดินไปยืนบนแท่นคำตอบ';$('q').style.display='block';beep(660,.1)}
function spawn(b){for(let k=0;k<10;k++){const g=mkCoin();g.position.copy(b.m.position);scene.add(g);parts.push({g,vx:(Math.random()-.5)*6,vy:6+Math.random()*4,vz:(Math.random()-.5)*6,l:1.4})}}
function answer(i){const{b,q,pads}=act,ok=i===q.a;pads.forEach(p=>scene.remove(p.g));act=null;$('q').style.display='none';b.used=true;b.m.material=matU;done++;
 if(ok){score+=10;spawn(b);beep(784,.1);setTimeout(()=>beep(1047,.2),100);toast('✅ ถูกต้อง! '+q.e,1)}
 else{lives--;shake=.6;beep(180,.3,'sawtooth');toast('❌ ยังไม่ใช่ — '+q.e,0)}
 hud();if(lives<=0||done>=BX.length)setTimeout(fin,1800)}
function fin(){playing=false;$('et').textContent=lives>0?'🎉 เก่งมาก!':'💔 หมดชีวิตแล้ว';$('ep').textContent=`ได้ ${score} คะแนน · ตอบแล้ว ${done}/${BX.length} กล่อง`;$('end').hidden=false}
function reset(){score=0;lives=3;done=0;if(act){act.pads.forEach(p=>scene.remove(p.g));act=null}$('q').style.display='none';BX.forEach(b=>{b.used=false;b.m.material=matQ});coins.forEach(c=>{c.on=true;c.g.visible=true});Object.assign(P,{x:0,z:0,y:0,vy:0,vx:0,vz:0});hud()}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b))});
$('go').onclick=()=>{reset();$('start').hidden=true;playing=true;beep(440,.1)};
$('again').onclick=()=>{$('end').hidden=true;$('start').hidden=false};
// ---------- loop ----------
function step(dt,t){
 let ix=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0)+jx,iz=(K.KeyS||K.ArrowDown?1:0)-(K.KeyW||K.ArrowUp?1:0)+jz;
 const m=Math.hypot(ix,iz);if(m>1){ix/=m;iz/=m}
 if(!playing){ix=iz=0}
 const sp=K.ShiftLeft||K.ShiftRight?11:7.5,k=Math.min(1,dt*12);
 P.vx+=(ix*sp-P.vx)*k;P.vz+=(iz*sp-P.vz)*k;
 let nx=P.x+P.vx*dt,nz=P.z+P.vz*dt;
 for(const s of solids){const dx=nx-s.x,dz=nz-s.z,d=Math.hypot(dx,dz)||1,mn=s.r+.4;if(d<mn&&P.y<s.h-.25){nx=s.x+dx/d*mn;nz=s.z+dz/d*mn}}
 P.x=clamp(nx,-46,46);P.z=clamp(nz,-46,46);
 let gy=0;for(const s of solids)if(s.h<50&&Math.hypot(P.x-s.x,P.z-s.z)<s.r+.2)gy=Math.max(gy,s.h);

 P.vy-=26*dt;P.y+=P.vy*dt;if(P.y<=gy&&P.vy<=0){P.y=gy;P.vy=0}
 const spd=Math.hypot(P.vx,P.vz),s01=Math.min(1,spd/7.5),air=P.y>gy+.05;
 if(spd>.6){const tg=Math.atan2(P.vx,P.vz),d=((tg-P.f+Math.PI*3)%(Math.PI*2))-Math.PI;P.f+=d*Math.min(1,dt*14)}

 shadow.position.set(P.x,gy+.03,P.z);shadow.scale.setScalar(Math.max(.4,1-(P.y-gy)*.12));

 else{legL.rotation.x=sw1;legR.rotation.x=-sw1;armL.rotation.x=-sw1+Math.sin(t*2)*.06*(1-s01);armR.rotation.x=sw1-Math.sin(t*2)*.06*(1-s01);armL.rotation.z=.08;armR.rotation.z=-.08;model.position.y=Math.abs(Math.sin(w))*.12*s01}
 model.scale.y=1+Math.sin(t*3)*.02*(1-s01);model.rotation.x=s01*.15;head.rotation.z=Math.sin(t*2)*.06;head.rotation.y=Math.sin(t*1.3)*.15*(1-s01);
 // world
 sw.forEach(o=>o.o.rotation.z=Math.sin(t*2+o.p)*o.a);
 clouds.forEach(c=>{c.position.x+=dt*.8;if(c.position.x>100)c.position.x=-100});
 coins.forEach(c=>{if(!c.on)return;c.g.rotation.y=t*3;c.g.position.y=1+Math.sin(t*3+c.x)*.15;if(playing&&Math.hypot(P.x-c.x,P.z-c.z)<1.1&&P.y<2.3){c.on=false;c.g.visible=false;score++;hud();beep(988,.08);setTimeout(()=>beep(1319,.15),70)}});
 BX.forEach((b,i)=>{if(b.used){b.m.position.y=2.4;return}b.m.position.y=2.4+Math.sin(t*2+i)*.15;b.m.rotation.y=t*.8;if(playing&&!act&&Math.hypot(P.x-b.x,P.z-b.z)<1.7)startQ(b)});
 if(act){act.pads.forEach((p,i)=>{p.g.scale.setScalar(1+Math.sin(t*5+i)*.05);if(playing&&act&&Math.hypot(P.x-p.x,P.z-p.z)<1.3&&P.y<1.5)answer(i)})}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy-=18*dt;p.g.position.x+=p.vx*dt;p.g.position.y+=p.vy*dt;p.g.position.z+=p.vz*dt;p.g.rotation.y+=dt*8;p.l-=dt;if(p.l<=0||p.g.position.y<0){scene.remove(p.g);parts.splice(i,1)}}
 // camera

 const sx=(Math.random()-.5)*shake;cam.position.x+=sx;cam.lookAt(P.x,P.y+1.5,P.z-1);cam.position.x-=sx;
}
